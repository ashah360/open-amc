name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run privacy:audit
      - run: npm test
      - run: npm run build
      - name: Packed artifact smoke (import + amc --help)
        run: npm run pack:smoke
      - name: Working tree is clean (no whitespace/build drift)
        run: git diff --check
